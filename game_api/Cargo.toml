[package]
name = "game_api"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tower-http = { version = "0.7.1", features = ["cors"] }
tower-sessions = "0.15.0"
dotenvy = "0.15.7"
argon2 = { version = "0.6.0", features = ["getrandom"] }
tower-sessions-sqlx-store = { version = "0.16.0", features = ["postgres"] }
rand =  "0.10.3"
